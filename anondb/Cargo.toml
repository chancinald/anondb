[package]
name = "anondb"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Database abstraction over a generic KV"

[lib]

[features]
default = ["redb"]
redb = ["anondb-kv/redb"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
log_ext = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }

env_logger = "0"

# serde_bytes = "0.11.17"
rmp = "0.8.14"
rmp-serde = "1.3.0"
rmpv = "1"

anyhow = { workspace = true }
anondb-kv = { workspace = true }
anondb-macros = { workspace = true }


[dev-dependencies]
rand = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
