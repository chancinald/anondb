[workspace]
resolver = "3"
members = ["anondb", "anondb-kv", "anondb-macros", "domacro"]

[workspace.dependencies]
anyhow = "1"
serde = "1"
log_ext = { package = "log", version = "0" }
futures = "0.3"
async-stream = "0.3"

anondb = "0.2"
anondb-macros = "0.2"
anondb-kv = "0.2"
domacro = "0"

rand = "0"

[patch.crates-io]
anondb = { path = "./anondb" }
anondb-macros = { path = "./anondb-macros" }
anondb-kv = { path = "./anondb-kv" }
domacro = { path = "./domacro" }
