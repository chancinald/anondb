[package]
name = "anondb"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Database abstraction over a generic KV"

[lib]

[features]
default = ["redb"]
redb = ["anondb-kv/redb"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
log_ext = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }

postcard = { version = "1.1.3", features = ["use-std"] }

anondb-kv = { workspace = true }
anondb-macros = { workspace = true }

[dev-dependencies]
env_logger = "0"
rand = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
paste = "1"
