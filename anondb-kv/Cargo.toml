[package]
name = "anondb-kv"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "anondb kv traits and backend implementations"

[lib]

[features]
default = ["redb"]
redb = ["dep:redb"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }

redb = { version = "2.6.3", optional = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
rpds = "1"

[dev-dependencies]
rand = { workspace = true }
rstest = "0"
paste = "1"
domacro = "0"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
